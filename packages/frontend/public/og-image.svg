<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- 배경 -->
  <rect width="1200" height="630" fill="url(#bg)"/>

  <!-- 로고 Q -->
  <rect x="100" y="200" width="150" height="150" rx="30" fill="white" fill-opacity="0.2"/>
  <text x="175" y="310" font-family="Arial, sans-serif" font-size="100" font-weight="bold" fill="white" text-anchor="middle">Q</text>

  <!-- 텍스트 -->
  <text x="300" y="280" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="white">Questy</text>
  <text x="300" y="350" font-family="Arial, sans-serif" font-size="32" fill="white" fill-opacity="0.9">AI 학습 코치</text>

  <!-- 설명 -->
  <text x="100" y="480" font-family="Arial, sans-serif" font-size="28" fill="white" fill-opacity="0.85">AI 기반 맞춤형 학습 플랜 생성 및 학습 코칭 서비스</text>
  <text x="100" y="530" font-family="Arial, sans-serif" font-size="24" fill="white" fill-opacity="0.7">수능/내신 대비 나만의 학습 플랜을 만들어보세요</text>
</svg>
