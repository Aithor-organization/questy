# Nixpacks configuration for Railway
# Node.js (pnpm) + Python multi-runtime support

[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm", "python311", "python311Packages.pip", "python311Packages.virtualenv"]

[phases.install]
cmds = [
  "pnpm install",
  "python3 -m venv /app/.venv",
  "/app/.venv/bin/pip install --upgrade pip",
  "/app/.venv/bin/pip install -r packages/curriculum-agent/requirements.txt"
]

[phases.build]
cmds = [
  "pnpm --filter @questybook/shared build",
  "pnpm --filter @questybook/backend build"
]

[start]
cmd = "node packages/backend/dist/index.js"

[variables]
PYTHON_PATH = "/app/.venv/bin/python3"
