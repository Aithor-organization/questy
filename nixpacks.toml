# Nixpacks configuration for Railway
# Node.js (pnpm) + Python multi-runtime support

[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm", "python311", "python311Packages.pip"]

[phases.install]
cmds = [
  "pnpm install",
  "pip install -r packages/curriculum-agent/requirements.txt"
]

[phases.build]
cmds = [
  "pnpm --filter @questybook/shared build",
  "pnpm --filter @questybook/backend build"
]

[start]
cmd = "node packages/backend/dist/index.js"
