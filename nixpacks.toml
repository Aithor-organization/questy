# Nixpacks configuration for Railway
# Node.js only (Python agents converted to TypeScript)

[phases.setup]
nixPkgs = ["nodejs_20", "nodePackages.pnpm"]

[phases.install]
cmds = ["pnpm install"]

[phases.build]
cmds = [
  "pnpm --filter @questybook/shared build",
  "pnpm --filter @questybook/backend build"
]

[start]
cmd = "node packages/backend/dist/index.js"
