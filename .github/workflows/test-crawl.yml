# 크롤링 테스트 워크플로우
# 단일 URL로 GitHub Actions 환경에서 크롤링 가능 여부 테스트

name: Test Crawl

on:
  # 수동 실행만
  workflow_dispatch:

jobs:
  test-crawl:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9

      - name: Install dependencies
        run: pnpm install

      - name: Run crawl test
        run: npx tsx scripts/test-crawl.ts
